<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM/NS - Dual Mode Crane & Yard Management</title>
    <style>
        :root {
            --amns-red: #C8102E;
            --amns-dark: #1E2229;
            --bg-light: #F4F5F7;
            --pickup-yellow: #F59E0B;
            --drop-green: #10B981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: var(--bg-light); color: var(--amns-dark); }

        header {
            background-color: var(--amns-red); color: white; padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .mode-switch {
            display: flex; background: rgba(0,0,0,0.25); padding: 4px; border-radius: 6px; gap: 4px;
        }
        .mode-btn {
            padding: 8px 18px; border: none; background: transparent; color: white;
            font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px;
        }
        .mode-btn.active { background: white; color: var(--amns-red); }

        .container { padding: 20px; max-width: 1600px; margin: 0 auto; }

        /* SENDER STYLING */
        .sender-grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #D1D5DB; margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 700; color: var(--amns-red); margin-bottom: 12px; border-bottom: 2px solid var(--amns-red); padding-bottom: 4px; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #D1D5DB; border-radius: 4px; font-size: 14px; }
        .btn { width: 100%; background: var(--amns-red); color: white; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 5px; }
        .btn:hover { background: #9B0B21; }

        /* RECEIVER (CRANE OPERATOR) STYLING - HIGH VISIBILITY */
        .task-banner {
            background: #FEF3C7; border: 3px solid var(--pickup-yellow); padding: 15px; border-radius: 8px;
            margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .task-info { font-size: 20px; font-weight: 800; }
        .btn-complete { background: var(--drop-green); color: white; padding: 12px 24px; border: none; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; }

        /* CGL EXIT PIT SADDLE VISUAL LAYOUT */
        .pit-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        .pit-card { background: #E5E7EB; padding: 15px; border-radius: 8px; border: 2px solid #9CA3AF; }
        .pit-title { text-align: center; font-weight: 800; font-size: 16px; margin-bottom: 10px; }
        .saddle-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .saddle-slot {
            background: white; border: 3px dashed #6B7280; height: 110px; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: bold; position: relative; cursor: pointer;
        }
        .saddle-slot.occupied { background: #FEE2E2; border: 3px solid var(--amns-red); }
        .saddle-slot.pickup-target { background: #FEF3C7; border: 4px solid var(--pickup-yellow); animation: pulse 1s infinite; }
        .saddle-slot.drop-target { background: #D1FAE5; border: 4px solid var(--drop-green); animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .slot-name { font-size: 12px; color: #4B5563; position: absolute; top: 6px; left: 6px; }
        .coil-tag { background: var(--amns-red); color: white; padding: 6px 10px; border-radius: 4px; font-size: 15px; font-weight: 800; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div style="font-size: 20px; font-weight: bold;">AM/NS LOGISTICS SYSTEM</div>
        <div class="mode-switch">
            <button class="mode-btn active" id="btnSender" onclick="switchMode('SENDER')">USER (SENDER / DISPATCH)</button>
            <button class="mode-btn" id="btnReceiver" onclick="switchMode('RECEIVER')">CRANE OPERATOR (RECEIVER)</button>
        </div>
    </header>

    <div class="container">
        
        <!-- ==================== MODE 1: USER / SENDER VIEW ==================== -->
        <div id="senderView" class="sender-grid">
            <div>
                <div class="card">
                    <div class="card-title">1. Move Request to Crane</div>
                    <div class="form-group">
                        <label>Coil Number</label>
                        <input type="text" id="sendCoilId" placeholder="e.g. COIL-908234">
                    </div>
                    <div class="form-group">
                        <label>Pickup From Location</label>
                        <input type="text" id="sendFromLoc" placeholder="e.g. PIT1-S1 or Yard A1">
                    </div>
                    <div class="form-group">
                        <label>Target Destination</label>
                        <input type="text" id="sendToLoc" placeholder="e.g. CGL-ENTRY or PIT2-S3">
                    </div>
                    <button class="btn" onclick="dispatchTask()">SEND TASK TO CRANE OPERATOR</button>
                </div>

                <div class="card">
                    <div class="card-title">2. Quick Exit Saddle Register</div>
                    <div class="form-group">
                        <label>Exit Saddle Slot</label>
                        <select id="quickSaddleSlot">
                            <option value="PIT1-S1">Pit 1 - Saddle Slot 1</option>
                            <option value="PIT1-S2">Pit 1 - Saddle Slot 2</option>
                            <option value="PIT1-S3">Pit 1 - Saddle Slot 3</option>
                            <option value="PIT2-S1">Pit 2 - Saddle Slot 1</option>
                            <option value="PIT2-S2">Pit 2 - Saddle Slot 2</option>
                            <option value="PIT2-S3">Pit 2 - Saddle Slot 3</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Coil Number at Exit</label>
                        <input type="text" id="quickCoilId" placeholder="e.g. CGL-EXIT-001">
                    </div>
                    <button class="btn" style="background:#4B5563;" onclick="registerExitCoil()">REGISTER AT EXIT SADDLE</button>
                </div>
            </div>

            <div>
                <div class="card">
                    <div class="card-title">CGL EXIT CAR PIT SADDLES (LIVE MONITORING)</div>
                    <div class="pit-container" id="senderPitContainer"></div>
                </div>
            </div>
        </div>

        <!-- ==================== MODE 2: CRANE RECEIVER VIEW ==================== -->
        <div id="receiverView" style="display: none;">
            
            <div id="activeTaskBanner" class="task-banner" style="display:none;">
                <div class="task-info">
                    🚨 ACTIVE TASK: Move Coil <span id="taskCoil" style="color:var(--amns-red);"></span> 
                    from [<span id="taskFrom"></span>] ➔ to [<span id="taskTo"></span>]
                </div>
                <button class="btn-complete" onclick="confirmTaskCompletion()">CONFIRM MOVE COMPLETE</button>
            </div>

            <div id="noTaskBanner" class="task-banner" style="background:#E5E7EB; border-color:#9CA3AF;">
                <div class="task-info" style="color:#4B5563;">✅ NO PENDING CRANE TASKS. WAITING FOR SENDER REQUESTS...</div>
            </div>

            <div class="card">
                <div class="card-title" style="font-size: 20px;">CRANE CABIN VIEW: CGL EXIT PIT SADDLES</div>
                <div class="pit-container" id="receiverPitContainer"></div>
            </div>
        </div>

    </div>

    <script>
        let currentMode = 'SENDER';
        let currentTasks = [];
        let trackingData = {};

        const pitSlots = ['PIT1-S1', 'PIT1-S2', 'PIT1-S3', 'PIT2-S1', 'PIT2-S2', 'PIT2-S3'];

        window.onload = function() {
            refreshData();
            setInterval(refreshData, 2000); // 2-second live sync across screens
        };

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btnSender').classList.toggle('active', mode === 'SENDER');
            document.getElementById('btnReceiver').classList.toggle('active', mode === 'RECEIVER');
            document.getElementById('senderView').style.display = (mode === 'SENDER') ? 'grid' : 'none';
            document.getElementById('receiverView').style.display = (mode === 'RECEIVER') ? 'block' : 'none';
            renderPits();
        }

        async function refreshData() {
            try {
                // Fetch inventory
                const resCoils = await fetch('/api/coils');
                const coils = await resCoils.json();
                trackingData = {};
                coils.forEach(c => trackingData[c.location] = c.coil_id);

                // Fetch crane tasks
                const resTasks = await fetch('/api/tasks');
                currentTasks = await resTasks.json();

                updateTaskBanner();
                renderPits();
            } catch (err) {
                console.error("Sync error:", err);
            }
        }

        function updateTaskBanner() {
            const activeTask = currentTasks[0];
            const activeBanner = document.getElementById('activeTaskBanner');
            const noTaskBanner = document.getElementById('noTaskBanner');

            if (activeTask) {
                activeBanner.style.display = 'flex';
                noTaskBanner.style.display = 'none';
                document.getElementById('taskCoil').innerText = activeTask.coil_id;
                document.getElementById('taskFrom').innerText = activeTask.from_location;
                document.getElementById('taskTo').innerText = activeTask.to_location;
            } else {
                activeBanner.style.display = 'none';
                noTaskBanner.style.display = 'flex';
            }
        }

        function renderPits() {
            const activeTask = currentTasks[0];
            const containerId = (currentMode === 'SENDER') ? 'senderPitContainer' : 'receiverPitContainer';
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            ['PIT 1', 'PIT 2'].forEach((pitName, pIdx) => {
                let pitCard = document.createElement('div');
                pitCard.className = 'pit-card';
                pitCard.innerHTML = `<div class="pit-title">${pitName} CAR SADDLE (3 COIL CAPACITY)</div>`;
                
                let saddleRow = document.createElement('div');
                saddleRow.className = 'saddle-row';

                for (let i = 1; i <= 3; i++) {
                    let slotLoc = `PIT${pIdx + 1}-S${i}`;
                    let slotDiv = document.createElement('div');
                    slotDiv.className = 'saddle-slot';

                    let slotLabel = document.createElement('span');
                    slotLabel.className = 'slot-name';
                    slotLabel.innerText = `Slot ${i} (${slotLoc})`;
                    slotDiv.appendChild(slotLabel);

                    // Check occupancy
                    if (trackingData[slotLoc]) {
                        slotDiv.classList.add('occupied');
                        let tag = document.createElement('div');
                        tag.className = 'coil-tag';
                        tag.innerText = trackingData[slotLoc];
                        slotDiv.appendChild(tag);
                    }

                    // Receiver Highlighting for Active Task
                    if (activeTask) {
                        if (activeTask.from_location === slotLoc) {
                            slotDiv.classList.add('pickup-target');
                        }
                        if (activeTask.to_location === slotLoc) {
                            slotDiv.classList.add('drop-target');
                        }
                    }

                    saddleRow.appendChild(slotDiv);
                }
                pitCard.appendChild(saddleRow);
                container.appendChild(pitCard);
            });
        }

        async function dispatchTask() {
            const coilId = document.getElementById('sendCoilId').value.trim().toUpperCase();
            const fromLoc = document.getElementById('sendFromLoc').value.trim().toUpperCase();
            const toLoc = document.getElementById('sendToLoc').value.trim().toUpperCase();

            if (!coilId || !toLoc) return alert("Fill in Coil ID and Destination");

            await fetch('/api/tasks/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ coil_id: coilId, from_location: fromLoc, to_location: toLoc, task_type: 'MOVE' })
            });

            document.getElementById('sendCoilId').value = '';
            document.getElementById('sendFromLoc').value = '';
            document.getElementById('sendToLoc').value = '';
            refreshData();
        }

        async function registerExitCoil() {
            const location = document.getElementById('quickSaddleSlot').value;
            const coilId = document.getElementById('quickCoilId').value.trim().toUpperCase();

            if (!coilId) return alert("Enter Coil ID");

            await fetch('/api/coils/place', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ department: 'CGL EXIT', layer: 'L1', location, coilId })
            });

            document.getElementById('quickCoilId').value = '';
            refreshData();
        }

        async function confirmTaskCompletion() {
            if (!currentTasks.length) return;
            const activeTask = currentTasks[0];

            await fetch('/api/tasks/complete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    task_id: activeTask.id,
                    coil_id: activeTask.coil_id,
                    from_location: activeTask.from_location,
                    to_location: activeTask.to_location
                })
            });

            refreshData();
        }
    </script>
</body>
</html>
